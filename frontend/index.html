<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş · Yemekhane Otomasyonu</title>
  <link rel="stylesheet" href="/css/temel.css">
</head>
<body>
  <main class="kapsayici giris-kapsayici">
    <section class="kart">
      <h1>Yemekhane Girişi</h1>
      <p id="mesaj" class="bildirim" role="alert" style="display:none"></p>
      <form id="giris-form">
        <div class="form-alan">
          <label for="eposta">E-posta</label>
          <input type="email" id="eposta" autocomplete="username" required>
        </div>
        <div class="form-alan">
          <label for="sifre">Şifre</label>
          <input type="password" id="sifre" autocomplete="current-password" required>
        </div>
        <button class="dugme" type="submit">Giriş yap</button>
      </form>
      <p class="ipucu" style="margin-top:1rem">
        Test hesapları (şifre: <strong>Yemek2026!</strong>):<br>
        ayse.demir@ogr.kampus.edu.tr · mehmet.yildiz@ogr.kampus.edu.tr ·
        murat.kaya@kampus.edu.tr · leyla.arslan@kampus.edu.tr (yönetici)
      </p>
    </section>
  </main>

  <script src="/js/ortak.js"></script>
  <script>
    if (Depo.token()) location.href = "/hafta.html";
    document.getElementById("giris-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const sonuc = await istek("/giris", {
          method: "POST",
          govde: { eposta: document.getElementById("eposta").value,
                   sifre: document.getElementById("sifre").value },
        });
        Depo.kaydet(sonuc.token, sonuc.kullanici);
        location.href = "/hafta.html";
      } catch (err) {
        bildirim("mesaj", err.message);
      }
    });
  </script>
</body>
</html>
